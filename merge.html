<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge PDF — VeloraPDF</title>
<meta name="description" content="Combine multiple PDFs into one file, entirely in your browser.">
<link rel="stylesheet" href="css/style.css">
<style>
  .tool-header { padding: 40px 0 8px; }
  .tool-header h1 {
    font-family: var(--font-display);
    font-size: 34px;
    font-weight: 500;
    margin: 0 0 8px;
  }
  .tool-header p { color: var(--mist); margin: 0 0 32px; font-size: 15px; }

  .dropzone {
    border: 1.5px dashed var(--line);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    color: var(--mist);
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .dropzone.drag-over {
    border-color: var(--blueprint);
    background: rgba(111, 151, 201, 0.06);
    color: var(--paper);
  }
  .dropzone .dz-title {
    font-family: var(--font-display);
    font-size: 18px;
    color: var(--paper);
    margin-bottom: 6px;
  }
  .dropzone .dz-sub { font-size: 13px; font-family: var(--font-mono); }
  .dropzone input { display: none; }

  .file-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
    margin: 28px 0;
  }

  .file-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    cursor: grab;
    position: relative;
    transition: border-color 0.15s ease, opacity 0.15s ease;
  }
  .file-card.dragging { opacity: 0.35; }
  .file-card.drag-target { border-color: var(--blueprint); }

  .file-card .order-badge {
    position: absolute;
    top: -8px;
    left: -8px;
    background: var(--blueprint);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .file-card canvas {
    width: 100%;
    height: 130px;
    object-fit: cover;
    background: var(--paper);
    border-radius: 2px;
    display: block;
    margin-bottom: 10px;
  }

  .file-card .fname {
    font-size: 12px;
    color: var(--paper-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-card .fmeta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--mist);
    margin-top: 2px;
  }

  .file-card .remove-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--stamp);
    color: var(--ink);
    border: none;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .actions-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 0 80px;
    border-top: 1px solid var(--line);
    margin-top: 8px;
  }

  .status-text {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--mist);
  }

  .back-link {
    display: inline-block;
    font-size: 13px;
    color: var(--mist);
    margin-bottom: 4px;
  }
  .back-link:hover { color: var(--blueprint); }
</style>
</head>
<body>

<div class="wrap">
  <header class="site">
    <a class="brand" href="index.html">VeloraPDF <span class="mark">CLIENT-SIDE</span></a>
    <nav class="site-links">
      <a href="index.html">All tools</a>
    </nav>
  </header>

  <div class="tool-header">
    <a class="back-link" href="index.html">&larr; Back to tools</a>
    <h1>Merge PDF</h1>
    <p>Add two or more PDFs, drag to set the order, then merge. Files are processed on your device only.</p>
  </div>

  <label class="dropzone" id="dropzone">
    <div class="dz-title">Drop PDFs here, or click to browse</div>
    <div class="dz-sub">nothing is uploaded &middot; multiple files supported</div>
    <input type="file" id="fileInput" accept="application/pdf" multiple>
  </label>

  <div class="file-list" id="fileList"></div>

  <div class="actions-bar">
    <button class="btn btn-primary" id="mergeBtn" disabled>Merge &amp; Download</button>
    <button class="btn btn-ghost" id="clearBtn" style="display:none">Clear all</button>
    <span class="status-text" id="statusText"></span>
  </div>
</div>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
</script>
<script src="js/merge.js"></script>
</body>
</html>
